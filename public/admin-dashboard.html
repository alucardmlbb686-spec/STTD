<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin dashboard — StarCurrency</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body data-page="admin-overview">
<div class="app-shell">
  <div data-include="admin-sidebar"></div>

  <div class="main-area">
    <header class="topbar">
      <button class="nav-toggle" id="sidebarToggle" style="display:flex;" aria-label="Toggle sidebar">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M2 4.5H16M2 9H16M2 13.5H16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <div class="input-group" style="width:320px; max-width:40vw;">
        <svg class="input-icon" viewBox="0 0 18 18" fill="none"><circle cx="8" cy="8" r="5.2" stroke="currentColor" stroke-width="1.5"/><path d="M15 15l-3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <input class="input" placeholder="Search users, requests, transaction IDs…" style="padding-top:10px; padding-bottom:10px;">
      </div>
      <div class="nav-actions">
        <span class="pill-tag" style="color:var(--star-400); border-color: rgba(51,196,138,.3); background: rgba(51,196,138,.08);">● All systems normal</span>
        <button class="icon-btn" aria-label="Notifications" style="width:40px;height:40px;">
          <svg width="17" height="17" viewBox="0 0 18 18" fill="none"><path d="M4 7.2c0-2.6 2-4.6 5-4.6s5 2 5 4.6c0 3.6 1.2 4.6 1.2 4.6H2.8S4 10.8 4 7.2Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M7.3 14.2a1.8 1.8 0 003.4 0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <div class="page-body">
      <div class="page-title-row">
        <div>
          <h1>Platform overview</h1>
          <div class="sub">Real-time snapshot of marketplace activity.</div>
        </div>
      </div>

      <div class="admin-alert" id="disputeAlert">
        <svg viewBox="0 0 20 20" fill="none"><path d="M10 2 18 17H2L10 2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 8v3.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="10" cy="13.6" r=".9" fill="currentColor"/></svg>
        <div>
          <div class="a-title">3 disputes need review</div>
          <div class="a-sub">Requests flagged by users as not received or incorrectly fulfilled. Review within SLA.</div>
        </div>
      </div>

      <div class="stats-grid" id="adminStats"></div>

      <div class="dash-grid">
        <div class="card">
          <div class="panel-head">
            <h3>All requests</h3>
            <span class="pill-tag" id="tableMeta">Loading…</span>
          </div>
          <div class="table-wrap" style="border:none;">
            <table class="data-table">
              <thead><tr><th>Request</th><th>User</th><th>Method</th><th>Amount</th><th>Status</th><th>Posted</th><th></th></tr></thead>
              <tbody id="adminTableBody">
                <tr><td colspan="7"><div class="skeleton" style="height:16px;margin:6px 0;"></div></td></tr>
                <tr><td colspan="7"><div class="skeleton" style="height:16px;margin:6px 0;"></div></td></tr>
                <tr><td colspan="7"><div class="skeleton" style="height:16px;margin:6px 0;"></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <div>
          <div class="card" style="margin-bottom:24px;">
            <div class="panel-head"><h3>Method distribution</h3></div>
            <div id="methodDist"></div>
          </div>
          <div class="card">
            <div class="panel-head"><h3>Recent admin activity</h3></div>
            <div id="adminActivity"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/js/main.js"></script>
<script src="/js/store.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
