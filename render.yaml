services:
  - type: web
    name: starcurrency
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: starcurrency-db
          property: connectionString
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ESCROW_BTC_ADDRESS
        sync: false
      - key: ESCROW_USDT_ADDRESS
        sync: false
      - key: BTC_USD_RATE
        sync: false
      - key: BLOCKCHAIN_WEBHOOK_SECRET
        sync: false
      - key: COINBASE_API_KEY_NAME
        sync: false
      - key: COINBASE_API_PRIVATE_KEY
        sync: false
      - key: COINBASE_RELEASE_WALLET_ID
        sync: false
      - key: COINBASE_RELEASE_ASSET_ID
        value: usdc
      - key: COINBASE_RELEASE_GASLESS
        value: "true"

databases:
  - name: starcurrency-db