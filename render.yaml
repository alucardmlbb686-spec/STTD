services:
  - type: web
    name: starcurrency
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: starcurrency-uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: starcurrency-db
          property: connectionString
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CDP_API_KEY_ID
        sync: false
      - key: CDP_API_KEY_SECRET
        sync: false
      - key: CDP_ACCOUNT_ID
        sync: false
      - key: COINBASE_ENV
        value: sandbox
      - key: ESCROW_MODE
        value: sandbox
      - key: BLOCKCHAIN_WEBHOOK_SECRET
        sync: false
      - key: CDP_API_KEY_ID
        sync: false
      - key: CDP_API_KEY_SECRET
        sync: false
      - key: CDP_WALLET_SECRET
        sync: false

databases:
  - name: starcurrency-db